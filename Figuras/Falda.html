<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>falda</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fde9ec;--card:#fff7f2;--ink:#5b3a4a;--pink:#f6c6d2;--mauve:#c98aa8;--teal:#4fb3c4;--line:#e9b8c8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3a2531;--card:#4a3040;--ink:#fbe4ea;--line:#7a5568}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS',sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:760px;padding:16px}
h1{font-size:1.6rem;margin:4px 0 12px;font-weight:600}
#stage{background:var(--card);border:3px solid var(--teal);border-radius:22px;overflow:hidden;touch-action:none;cursor:grab}
canvas{display:block;width:100%;height:auto}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;align-items:center}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--card);outline:2px solid var(--line);cursor:pointer}
.sw[aria-pressed="true"]{outline:3px solid var(--teal)}
button.b{font:inherit;background:var(--mauve);color:#fff;border:0;border-radius:14px;padding:9px 16px;cursor:pointer}
button.b:focus-visible,.sw:focus-visible{outline:3px solid var(--teal)}
.hint{font-size:.95rem;line-height:1.5}
.mat{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:10px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px 14px;font-variant-numeric:tabular-nums;max-width:300px;text-align:right}
.mat span{font-size:.95rem}
</style>
</head>
<body>
<main>
<h1>Probador de faldas 3D</h1>
<div id="stage"><canvas id="c" width="760" height="560" tabindex="0" aria-label="Falda en 3D: arrastra para girarla"></canvas></div>
<div class="row" id="sws" role="group" aria-label="Colores de la falda"></div>
<div class="row">
<button class="b" id="auto">Girar sola</button>
<button class="b" id="reset">Reiniciar</button>
</div>
<p class="hint">Arrastra con el ratón o el dedo para girar en X e Y. Con Shift (o botón derecho) arrastra para girar en Z.<br>
Teclado: ←→ eje Y · ↑↓ eje X · Q/E eje Z · R reinicia · Espacio gira sola.</p>
<p class="hint">Matriz de rotación actual R = Rz · Ry · Rx</p>
<div class="mat" id="mat"></div>
</main>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=cv.width,H=cv.height;
let rx=-0.25,ry=0.6,rz=0,auto=false;

/* ---- Matrices de rotación 3x3 ---- */
const Rx=a=>[[1,0,0],[0,Math.cos(a),-Math.sin(a)],[0,Math.sin(a),Math.cos(a)]];
const Ry=a=>[[Math.cos(a),0,Math.sin(a)],[0,1,0],[-Math.sin(a),0,Math.cos(a)]];
const Rz=a=>[[Math.cos(a),-Math.sin(a),0],[Math.sin(a),Math.cos(a),0],[0,0,1]];
const mul=(A,B)=>A.map((_,i)=>B[0].map((_,j)=>A[i][0]*B[0][j]+A[i][1]*B[1][j]+A[i][2]*B[2][j]));
const apply=(M,p)=>[M[0][0]*p[0]+M[0][1]*p[1]+M[0][2]*p[2],M[1][0]*p[0]+M[1][1]*p[1]+M[1][2]*p[2],M[2][0]*p[0]+M[2][1]*p[1]+M[2][2]*p[2]];

/* ---- Paletas ---- */
const pal=[{n:'Pastelería',a:'#f6c6d2',b:'#c98aa8',t:'#4fb3c4'},{n:'Menta',a:'#bfe6ee',b:'#4fb3c4',t:'#f6c6d2'},{n:'Lavanda',a:'#d9b8ee',b:'#fff0d8',t:'#c98aa8'},{n:'Durazno',a:'#ffe0b8',b:'#f6c6d2',t:'#8a5a3c'}];
let cur=0;
const sws=document.getElementById('sws');
pal.forEach((p,i)=>{const s=document.createElement('button');s.className='sw';s.title=p.n;s.setAttribute('aria-label',p.n);
s.style.background=`linear-gradient(90deg,${p.a} 50%,${p.b} 50%)`;s.onclick=()=>{cur=i;mark()};sws.appendChild(s)});
const mark=()=>[...sws.children].forEach((s,i)=>s.setAttribute('aria-pressed',i==cur));mark();
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));

/* ---- Geometría de la falda (quads) ---- */
const N=28,M=6,quads=[];
const pt=(i,t)=>{const a=i/N*Math.PI*2,r=0.5+0.75*Math.pow(t,1.3)+Math.cos(i*Math.PI)*0+ (Math.cos(a*14)*0.07*t);
return [Math.cos(a)*r,1-1.8*t,Math.sin(a)*r]};
for(let i=0;i<N;i++)for(let j=0;j<M;j++){
 quads.push({p:[pt(i,j/M),pt(i+1,j/M),pt(i+1,(j+1)/M),pt(i,(j+1)/M)],c:j==M-1?'t':(Math.floor(i/2)%2?'a':'b'),tint:1-j*0.03});
}
const band=(y0,y1,r,k,c)=>{for(let i=0;i<N;i++){const a0=i/N*6.2832,a1=(i+1)/N*6.2832;
 quads.push({p:[[Math.cos(a0)*r,y0,Math.sin(a0)*r],[Math.cos(a1)*r,y0,Math.sin(a1)*r],[Math.cos(a1)*r,y1,Math.sin(a1)*r],[Math.cos(a0)*r,y1,Math.sin(a0)*r]],c:c,tint:1})}};
band(1,1.16,0.5,0,'t');
/* moño en la cintura */
const bow=[[[0,1.1,0.52],[0.32,1.26,0.52],[0.32,0.94,0.52]],[[0,1.1,0.52],[-0.32,1.26,0.52],[-0.32,0.94,0.52]],[[-0.06,1.16,0.53],[0.06,1.16,0.53],[0.06,1.04,0.53],[-0.06,1.04,0.53]]];
bow.forEach((p,k)=>quads.push({p:p,c:k<2?'b':'t',tint:1,fixed:true}));

/* ---- Render ---- */
const L=[0.4,0.7,0.6];
function draw(){
 const R=mul(Rz(rz),mul(Ry(ry),Rx(rx)));
 /* fondo: cielo, edificios, suelo */
 g.fillStyle='#bfe6ee';g.fillRect(0,0,W,H);
 g.fillStyle='#f8d9de';[[40,200,90],[170,120,70],[300,60,80],[440,150,90],[580,180,70],[660,90,100]].forEach(b=>g.fillRect(b[0],b[1],b[2],H));
 g.fillStyle='#d9a0b6';[[0,300,70],[210,330,80],[520,310,90],[640,270,120]].forEach(b=>g.fillRect(b[0],b[1],b[2],H));
 g.fillStyle='#f0c9b4';g.fillRect(0,H*0.78,W,H);
 g.fillStyle='#fff0d8';g.beginPath();g.ellipse(W/2,H*0.9,210,34,0,0,6.2832);g.fill();
 /* proyectar */
 const f=520,cam=4.6,sc=170,out=[];
 quads.forEach(q=>{
  const v=q.p.map(p=>{const r=apply(R,p),k=f/(f+(r[2]+cam)*60);return{x:W/2+r[0]*sc*k*1.1,y:H*0.46-r[1]*sc*k*1.1,z:r[2],r:r}});
  const a=[v[1].r[0]-v[0].r[0],v[1].r[1]-v[0].r[1],v[1].r[2]-v[0].r[2]],b=[v[2].r[0]-v[0].r[0],v[2].r[1]-v[0].r[1],v[2].r[2]-v[0].r[2]];
  let n=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];const l=Math.hypot(...n)||1;n=n.map(x=>x/l);
  const d=Math.abs(n[0]*L[0]+n[1]*L[1]+n[2]*L[2]);
  out.push({v:v,z:v.reduce((s,p)=>s+p.z,0)/v.length,c:q.c,sh:(0.68+0.32*d)*q.tint,back:n[2]>0});
 });
 out.sort((p,q)=>q.z-p.z);
 const P=pal[cur];
 out.forEach(o=>{const c=rgb(P[o.c]),s=o.sh*(o.back?0.88:1);
  g.fillStyle=`rgb(${c.map(x=>Math.min(255,x*s)|0)})`;g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1;
  g.beginPath();o.v.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();g.fill();g.stroke()});
 /* matriz */
 document.getElementById('mat').innerHTML=R.flat().map(x=>`<span>${x.toFixed(2)}</span>`).join('');
}
/* ---- Entrada ---- */
let drag=null;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,z:e.shiftKey||e.button==2};cv.focus()});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=(e.clientX-drag.x)*0.01,dy=(e.clientY-drag.y)*0.01;
 if(drag.z)rz+=dx;else{ry+=dx;rx+=dy}drag.x=e.clientX;drag.y=e.clientY});
cv.addEventListener('pointerup',()=>drag=null);
const reset=()=>{rx=-0.25;ry=0.6;rz=0};
document.getElementById('reset').onclick=reset;
const ab=document.getElementById('auto');ab.onclick=()=>{auto=!auto;ab.textContent=auto?'Parar':'Girar sola'};
addEventListener('keydown',e=>{const s=0.08,k=e.key.toLowerCase();
 if(k=='arrowleft')ry-=s;else if(k=='arrowright')ry+=s;else if(k=='arrowup')rx-=s;else if(k=='arrowdown')rx+=s;
 else if(k=='q')rz-=s;else if(k=='e')rz+=s;else if(k=='r')reset();else if(k==' '&&e.target===cv){ab.click()}else return;
 e.preventDefault()});
(function loop(){if(auto&&!drag)ry+=0.012;draw();requestAnimationFrame(loop)})();
</script>
</body>
</html>
